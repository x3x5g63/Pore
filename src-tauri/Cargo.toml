[package]
name = "pore"
version = "0.1.0"
description = "Pore — fast, zero-AI code, Markdown & Git diff reader"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for the transparent macOS window.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
# No https/ssh: a reader only needs local repository access (avoids OpenSSL/libssh2).
git2 = { version = "0.20", default-features = false }
similar = { version = "2", features = ["inline"] }
content_inspector = "0.2"
fontdb = "0.23"
notify-debouncer-mini = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

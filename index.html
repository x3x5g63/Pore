<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Pore</title>
    <!-- Paint the saved theme background before CSS/JS loads to prevent flash. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html { background: #08090a; }
      @media (prefers-color-scheme: light) { html { background: #ffffff; } }
    </style>
    <script>
      try {
        var bg = localStorage.getItem("pore:themeBg");
        if (bg) document.documentElement.style.background = bg;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
